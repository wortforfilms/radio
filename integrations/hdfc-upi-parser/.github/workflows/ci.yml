name: HDFC Parser CI
on:
  push:
    paths:
      - "integrations/hdfc-upi-parser/**"
  pull_request:
    paths:
      - "integrations/hdfc-upi-parser/**"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s integrations/hdfc-upi-parser/tests


[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hdfc-upi-parser"
version = "0.1.0"
description = "Fail-closed HDFC/UPI email parser scaffold for payment proof evidence intake."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Radio Vaigyaaniq", email = "unknown@example.invalid" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial"
]
dependencies = [
  "python-dateutil>=2.8.2",
  "pydantic>=2.5.0",
  "flask>=3.0.0",
  "flask-cors>=4.0.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.12.0",
  "redis>=5.0.0",
  "celery>=5.3.0",
  "prometheus-client>=0.19.0",
  "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.12.0",
  "flake8>=7.0.0",
  "mypy>=1.7.0",
  "isort>=5.13.0"
]
ml = [
  "scikit-learn>=1.3.0",
  "numpy>=1.24.0"
]

[project.scripts]
hdfc-parser = "hdfc_upi_parser.cli.main:main"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

